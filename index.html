<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cutscene Studio Pro (16:9)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #0f111a; --panel: #1a1d2d; --accent: #7c3aed; --border: #2e334d; --text: #f3f4f6; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 20px; }
    h1, h3, h4 { margin-top: 0; color: #fff; }
    .grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
    .panel { background: var(--panel); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    .field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8em; color: #9ca3af; }
    input, button, select { padding: 8px; background: #252a41; color: var(--text); border: 1px solid var(--border); border-radius: 4px; }
    button { cursor: pointer; background: var(--accent); font-weight: bold; border: none; }
    button:hover { opacity: 0.9; }
    .btn-select { background: #252a41; border: 1px dashed #4b5563; text-align: left; }
    .btn-success { background: #10b981; }

    #auth-screen { max-width: 400px; margin: 80px auto; text-align: center; }
    
    .stage-container { 
      position: relative; 
      width: 480px; 
      height: 270px; 
      background: #000; 
      border: 2px solid var(--border); 
      border-radius: 8px; 
      overflow: hidden; 
      background-size: cover; 
      background-position: center; 
      margin: 0 auto 20px auto; 
    }
    
    .draggable-actor { 
      position: absolute; 
      width: 48px; 
      height: 48px; 
      cursor: move; 
      user-select: none; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      z-index: 10; 
    }
    .draggable-actor img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; image-rendering: pixelated; }
    .actor-label { font-size: 8px; background: rgba(0,0,0,0.7); padding: 1px 3px; border-radius: 3px; margin-top: 1px; white-space: nowrap; }

    #dialogue-overlay { display: none; position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(0,0,0,0.9); border: 2px solid #fff; border-radius: 6px; padding: 12px; color: #fff; z-index: 100; pointer-events: none; }
    #dialogue-overlay .speaker { font-weight: bold; color: #f59e0b; margin-bottom: 4px; }
    #dialogue-overlay .text { font-style: normal; }
    #dialogue-overlay .text.narrator-style { font-style: italic; }

    .timeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .timeline-wrapper { background: #131625; border: 1px solid var(--border); border-radius: 6px; padding: 10px; position: relative; overflow-x: auto; user-select: none; }
    .timeline-ruler { display: flex; border-bottom: 1px solid var(--border); padding-bottom: 5px; font-size: 11px; color: #6b7280; }
    .ruler-mark { flex: 1; border-left: 1px solid #2e334d; padding-left: 4px; min-width: 60px; }
    .timeline-tracks { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; min-height: 120px; width: 100%; }
    
    .track-row { position: relative; height: 36px; background: rgba(255,255,255,0.02); border-radius: 4px; width: 100%; display: flex; align-items: center; }
    .track-label { width: 100px; font-size: 11px; font-weight: bold; padding-left: 8px; color: #a7f3d0; border-right: 1px solid var(--border); text-overflow: ellipsis; overflow: hidden; white-space: nowrap; flex-shrink: 0; }
    .track-content { position: relative; flex: 1; height: 100%; }

    .timeline-block { position: absolute; height: 28px; top: 4px; background: #a855f7; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: bold; color: #fff; cursor: pointer; display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }
    .timeline-block.actor-track { background: #10b981; }
    .timeline-block.dialogue { background: #f59e0b; }
    .timeline-block.move { background: #3b82f6; }

    .resizer { position: absolute; top: 0; width: 8px; height: 100%; cursor: e-resize; background: rgba(0,0,0,0.3); }
    .resizer.right { right: 0; border-radius: 0 4px 4px 0; }
    .resizer.left { left: 0; border-radius: 4px 0 0 4px; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
    .modal-content { background: var(--panel); border-radius: 8px; padding: 20px; max-width: 900px; margin: 0 auto; border: 1px solid var(--border); }
    .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .asset-card { background: #252a41; border: 1px solid var(--border); border-radius: 6px; padding: 10px; text-align: center; cursor: pointer; }
    .asset-card img { max-width: 100%; height: 70px; object-fit: contain; image-rendering: pixelated; }
  </style>
</head>
<body>

  <div id="auth-screen" class="panel">
    <h3>Autenticazione Richiesta</h3>
    <div id="auth-logged" style="display:none;">
      <p id="user-info"></p>
      <button class="btn-success" style="width:100%" onclick="enterEditor()">Entra nell'Editor</button>
    </div>
    <div id="auth-form">
      <div class="field" style="text-align:left;"><label>Email:</label><input type="email" id="auth-email"></div>
      <div class="field" style="text-align:left;"><label>Password:</label><input type="password" id="auth-password"></div>
      <button style="width:100%; margin-top:10px;" onclick="login()">Accedi</button>
    </div>
  </div>

  <div id="editor-screen" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h1>Cutscene Studio Pro (16:9)</h1>
      <button style="background:#dc2626;" onclick="logout()">Disconnetti</button>
    </div>

    <div class="panel" style="display:flex; gap:10px; flex-wrap:wrap;">
      <button style="background:#3b82f6;" onclick="loadCutsceneFromSupabase()">☁️ Carica da Supabase</button>
      <button style="background:#8b5cf6;" onclick="document.getElementById('import-json-file').click()">📂 Importa JSON</button>
      <input type="file" id="import-json-file" style="display:none;" accept=".json" onchange="importLocalJSON(event)">
      
      <button style="background:#0284c7;" onclick="triggerUploadBackground()">🖼️ Aggiungi Sfondo a Supabase</button>
      <button style="background:#0d9488;" onclick="triggerUploadMusic()">🎵 Aggiungi Musica a Supabase</button>
      <input type="file" id="hidden-bg-file" style="display:none;" accept="image/png,image/jpeg" onchange="uploadBackgroundFile(event)">
      <input type="file" id="hidden-music-file" style="display:none;" accept="audio/mp3,audio/mpeg" onchange="uploadMusicFile(event)">
    </div>

    <div class="grid">
      <div>
        <div class="panel">
          <h3>1. Impostazioni Scena</h3>
          <div class="field">
            <label>Durata Totale Cutscene (s):</label>
            <input type="number" id="cutscene-duration" value="8" min="1" max="60" onchange="updateCutsceneDuration()">
          </div>
          <div class="field">
            <label>Sfondo Scena:</label>
            <button class="btn-select" id="lbl-bg" onclick="openPicker('background')">📁 Seleziona Sfondo...</button>
          </div>
          <div class="field">
            <label>Musica:</label>
            <button class="btn-select" id="lbl-music" onclick="openPicker('music')">📁 Seleziona Musica...</button>
          </div>
          <div class="field">
            <label>Dimensione Sprite Globale (%):</label>
            <input type="number" id="global-sprite-scale" value="100" min="10" max="500" oninput="updateSpriteScale(this.value)">
          </div>

          <hr style="border-color:var(--border); margin:15px 0;">

          <h3>2. Aggiungi Personaggio</h3>
          <div class="field">
            <label>Tipo:</label>
            <select id="new-actor-type">
              <option value="png">PNG / NPC</option>
              <option value="companion">Companion</option>
            </select>
          </div>
          <div class="field">
            <label>Nome Personaggio:</label>
            <input type="text" id="new-actor-name" placeholder="Es. Guardia 1, Companion Rex...">
          </div>

          <button class="btn-select" style="margin-top:10px;" id="lbl-new-actor-asset" onclick="openPickerForNewActor()">📁 Scegli Asset e Aggiungi ➔</button>
        </div>

        <div class="panel">
          <h3>3. Evento Dialogo</h3>
          <div class="field">
            <label>Chi Parla:</label>
            <select id="dialogue-speaker"></select>
          </div>
          <div class="field">
            <label>Testo Dialogo:</label>
            <input type="text" id="event-text" placeholder="Messaggio...">
          </div>
          <div class="field">
            <label>Tempo Inizio (s):</label>
            <input type="number" id="event-start" value="0" step="0.5">
          </div>
          <div class="field">
            <label>Durata (s):</label>
            <input type="number" id="event-duration" value="2" step="0.5">
          </div>
          <button class="btn-success" onclick="addDialogueEvent()">+ Aggiungi Dialogo</button>
        </div>
      </div>

      <div>
        <div id="stage" class="stage-container" onclick="handleStageGlobalClick(event)">
          <div id="dialogue-overlay">
            <div class="speaker" id="dialogue-speaker-name">Speaker</div>
            <div class="text" id="dialogue-text-content">...</div>
          </div>
        </div>

        <div class="panel">
          <div class="timeline-header">
            <h3>Timeline Entità & Eventi <span id="time-display">0.0 / 8.0 s</span></h3>
            <div>
              <button style="background:#2563eb;" onclick="startPreview()">▶ Riproduci</button>
              <button style="background:#dc2626;" onclick="stopPreview()">⏹ Stop</button>
            </div>
          </div>

          <div class="timeline-wrapper" id="timeline-wrapper">
            <div class="timeline-ruler" id="timeline-ruler">
              <!-- Righello generato dinamicamente -->
            </div>
            <div id="timeline-tracks" class="timeline-tracks"></div>
          </div>

          <br>
          <div style="display:flex; gap:10px;">
            <button style="flex:1; background:#10b981;" onclick="saveToSupabase()">☁️ Salva Cutscene</button>
            <button style="flex:1; background:#e67e22;" onclick="exportJSON()">💾 Scarica JSON</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="picker-modal" class="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
        <h3 id="modal-title">Seleziona Asset</h3>
        <button style="background:#dc3545;" onclick="closePicker()">Chiudi ✖</button>
      </div>
      <div id="asset-container" class="asset-grid"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://tssgkiytaxmcrodrcrpu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_3JHORvzXFoBh7XVVuSqgTg__ezQdQMa";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let backgroundPath = '';
    let musicPath = '';
    let cutsceneDuration = 8;
    let globalSpriteScale = 100;
    let currentUsername = 'Utente';
    
    let actorsList = [];

    let timelineEvents = [];
    let isPreviewRunning = false;
    let isDialogueWaiting = false;
    let clickMoveStep = 0; 
    let clickMoveTargetActor = null;
    let bgAudio = new Audio();
    let previewTimer = null;
    let pendingActorAssetType = '';
    let currentPickerCategory = '';

    window.onload = async () => {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        currentUsername = session.user.email.split('@')[0];
        document.getElementById('auth-logged').style.display = 'block';
        document.getElementById('auth-form').style.display = 'none';
        document.getElementById('user-info').innerText = `Logged: ${session.user.email}`;
      } else {
        document.getElementById('auth-logged').style.display = 'none';
        document.getElementById('auth-form').style.display = 'block';
      }

      // Inizializza l'attore principale con il nome utente se non già presente
      if (actorsList.length === 0) {
        actorsList.push({
          id: 'hero',
          name: currentUsername,
          type: 'hero',
          asset: 'sprite/personaggioprincipale/fallback/standing.png',
          pos: [216, 111]
        });
      }

      renderRuler();
      renderStageActors();
      renderTimeline();
      updateDropdownOptions();
    };

    async function login() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const { error } = await _supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert("Errore Autenticazione: " + error.message);
      } else {
        const { data: { session } } = await _supabase.auth.getSession();
        if (session) {
          currentUsername = session.user.email.split('@')[0];
          // Aggiorna anche il nome del primo attore se è rimasto quello di default o precedente
          if (actorsList.length > 0 && actorsList[0].id === 'hero') {
            actorsList[0].name = currentUsername;
          }
        }
        enterEditor();
        renderStageActors();
        renderTimeline();
        updateDropdownOptions();
      }
    }

    async function logout() {
      await _supabase.auth.signOut();
      document.getElementById('editor-screen').style.display = 'none';
      document.getElementById('auth-screen').style.display = 'block';
      document.getElementById('auth-logged').style.display = 'none';
      document.getElementById('auth-form').style.display = 'block';
    }

    function enterEditor() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('editor-screen').style.display = 'block';
    }

    function updateCutsceneDuration() {
      const val = parseFloat(document.getElementById('cutscene-duration').value);
      if (val && val > 0) {
        cutsceneDuration = val;
        renderRuler();
        renderTimeline();
        document.getElementById('time-display').innerText = `0.0 / ${cutsceneDuration.toFixed(1)} s`;
      }
    }

    function updateSpriteScale(val) {
      globalSpriteScale = parseInt(val) || 100;
      document.querySelectorAll('.draggable-actor').forEach(el => {
        const img = el.querySelector('img');
        if (img) {
          const baseSize = 48;
          const newSize = (baseSize * globalSpriteScale) / 100;
          el.style.width = newSize + 'px';
          el.style.height = newSize + 'px';
        }
      });
    }

    function renderRuler() {
      const ruler = document.getElementById('timeline-ruler');
      ruler.innerHTML = '';
      const steps = 5;
      for (let i = 0; i <= steps; i++) {
        const timeMark = ((cutsceneDuration / steps) * i).toFixed(1);
        const mark = document.createElement('div');
        mark.className = 'ruler-mark';
        mark.innerText = `${timeMark}s`;
        ruler.appendChild(mark);
      }
    }

    function triggerUploadBackground() {
      document.getElementById('hidden-bg-file').click();
    }

    async function uploadBackgroundFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const folderChoice = prompt("Inserisci il nome della cartella in cui caricare lo sfondo (es. trama1 o un nuovo nome):");
      if (!folderChoice) return;

      const folderName = folderChoice.trim().toLowerCase().replace(/\s+/g, '-');
      const filePath = `background/${folderName}/${file.name}`;

      try {
        const { error } = await _supabase.storage.from('assets').upload(filePath, file, { upsert: true });
        if (error) throw error;
        alert("✅ Caricato");
      } catch (e) {
        alert("Errore durante l'upload dello sfondo: " + e.message);
      }
      event.target.value = '';
    }

    function triggerUploadMusic() {
      document.getElementById('hidden-music-file').click();
    }

    async function uploadMusicFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const filePath = `music/${file.name}`;

      try {
        const { error } = await _supabase.storage.from('assets').upload(filePath, file, { upsert: true });
        if (error) throw error;
        alert("✅ Caricato");
      } catch (e) {
        alert("Errore durante l'upload della musica: " + e.message);
      }
      event.target.value = '';
    }

    async function loadCutsceneFromSupabase() {
      const dayNumber = prompt("Inserisci il numero del giorno da caricare (es. 1):");
      if (!dayNumber) return;

      const fileName = `cutscenes/giorno${dayNumber.trim()}.json`;
      try {
        const { data, error } = await _supabase.storage.from('assets').download(fileName);
        if (error) throw error;

        const text = await data.text();
        const json = JSON.parse(text);

        backgroundPath = json.background || '';
        musicPath = json.music || '';
        cutsceneDuration = json.duration || 8;
        globalSpriteScale = json.spriteScale || 100;
        actorsList = json.actors || actorsList;
        timelineEvents.length = 0;
        if (json.events) timelineEvents.push(...json.events);

        document.getElementById('cutscene-duration').value = cutsceneDuration;
        document.getElementById('global-sprite-scale').value = globalSpriteScale;

        if (backgroundPath) {
          document.getElementById('stage').style.backgroundImage = `url(${SUPABASE_URL}/storage/v1/object/public/assets/${backgroundPath})`;
          document.getElementById('lbl-bg').innerText = `✅ Caricato`;
        }
        if (musicPath) {
          document.getElementById('lbl-music').innerText = `✅ Caricato`;
        }

        renderRuler();
        renderStageActors();
        renderTimeline();
        updateDropdownOptions();
        alert(`Cutscene ${fileName} caricata con successo!`);
      } catch (e) {
        alert("Errore nel caricamento: " + e.message);
      }
    }

    function importLocalJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const json = JSON.parse(e.target.result);
          backgroundPath = json.background || '';
          musicPath = json.music || '';
          cutsceneDuration = json.duration || 8;
          globalSpriteScale = json.spriteScale || 100;
          actorsList = json.actors || actorsList;
          timelineEvents.length = 0;
          if (json.events) timelineEvents.push(...json.events);

          document.getElementById('cutscene-duration').value = cutsceneDuration;
          document.getElementById('global-sprite-scale').value = globalSpriteScale;

          if (backgroundPath) {
            document.getElementById('stage').style.backgroundImage = `url(${SUPABASE_URL}/storage/v1/object/public/assets/${backgroundPath})`;
            document.getElementById('lbl-bg').innerText = `✅ Importato`;
          }
          renderRuler();
          renderStageActors();
          renderTimeline();
          updateDropdownOptions();
          alert("JSON importato con successo!");
        } catch (err) {
          alert("File JSON non valido.");
        }
      };
      reader.readAsText(file);
    }

    function renderStageActors() {
      const stage = document.getElementById('stage');
      stage.querySelectorAll('.draggable-actor').forEach(el => el.remove());

      actorsList.forEach(actor => {
        const div = document.createElement('div');
        div.className = 'draggable-actor';
        div.id = `actor-dom-${actor.id}`;
        div.style.left = actor.pos[0] + 'px';
        div.style.top = actor.pos[1] + 'px';

        const baseSize = 48;
        const scaledSize = (baseSize * globalSpriteScale) / 100;
        div.style.width = scaledSize + 'px';
        div.style.height = scaledSize + 'px';

        div.innerHTML = `
          <img src="${SUPABASE_URL}/storage/v1/object/public/assets/${actor.asset}">
          <div class="actor-label">${actor.name}</div>
        `;

        let isDragging = false, offset = [0, 0];
        div.addEventListener('mousedown', (e) => {
          if (isPreviewRunning || clickMoveStep !== 0) return;
          isDragging = true;
          offset = [div.offsetLeft - e.clientX, div.offsetTop - e.clientY];
        });

        document.addEventListener('mousemove', (e) => {
          if (!isDragging) return;
          const maxW = 480 - scaledSize;
          const maxH = 270 - scaledSize;
          const x = Math.max(0, Math.min(maxW, e.clientX + offset[0]));
          const y = Math.max(0, Math.min(maxH, e.clientY + offset[1]));
          div.style.left = x + 'px';
          div.style.top = y + 'px';
          actor.pos = [x, y];
        });

        document.addEventListener('mouseup', () => isDragging = false);
        stage.appendChild(div);
      });
    }

    function updateDropdownOptions() {
      const spkSelect = document.getElementById('dialogue-speaker');
      spkSelect.innerHTML = '<option value="Narratore">Narratore</option>';
      actorsList.forEach(a => {
        spkSelect.innerHTML += `<option value="${a.name}">${a.name}</option>`;
      });
    }

    function openPickerForNewActor() {
      const name = document.getElementById('new-actor-name').value.trim();
      if (!name) return alert("Inserisci prima un nome per il personaggio!");
      
      const type = document.getElementById('new-actor-type').value;
      pendingActorAssetType = type;
      openPicker(type);
    }

    async function openPicker(category, subFolder = '') {
      currentPickerCategory = category;
      document.getElementById('modal-title').innerText = `Seleziona ${category.toUpperCase()}`;
      document.getElementById('picker-modal').style.display = 'block';
      await loadPickerItems(category, subFolder);
    }

    function closePicker() { document.getElementById('picker-modal').style.display = 'none'; }

    async function loadPickerItems(category, subFolder = '') {
      const container = document.getElementById('asset-container');
      container.innerHTML = 'Caricamento...';

      let fetchPath = category === 'background' ? 'background' : 
                      (category === 'music' ? 'music' : 
                      (category === 'png' ? 'sprite/png' : 'sprite/companion'));

      if (subFolder) fetchPath += `/${subFolder}`;
      const { data } = await _supabase.storage.from('assets').list(fetchPath);
      container.innerHTML = '';

      for (const item of data || []) {
        const fullPath = `${fetchPath}/${item.name}`;
        const card = document.createElement('div');
        card.className = 'asset-card';

        if (!item.id && (category === 'png' || category === 'companion')) {
          const standingFilePath = `${fullPath}/standing.png`;
          const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/assets/${standingFilePath}`;

          card.innerHTML = `
            <img src="${publicUrl}" style="object-fit:contain;" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'50\' height=\'50\'><text y=\'30\' font-size=\'25\'>📁</text></svg>';"><br>
            <span style="font-size:11px;">${item.name}</span>
          `;
          card.onclick = () => openPicker(category, item.name);
        } 
        else if (!item.id) {
          card.innerHTML = `📁<br><span style="font-size:11px;">${item.name}</span>`;
          card.onclick = () => openPicker(category, item.name);
        } 
        else {
          if (category === 'music') {
            card.innerHTML = `🎵<br><span style="font-size:11px;">${item.name}</span>`;
          } else {
            card.innerHTML = `<img src="${SUPABASE_URL}/storage/v1/object/public/assets/${fullPath}" style="object-fit:contain;"><br><span style="font-size:11px;">${item.name}</span>`;
          }

          card.onclick = () => {
            if (category === 'background') {
              backgroundPath = fullPath;
              document.getElementById('stage').style.backgroundImage = `url(${SUPABASE_URL}/storage/v1/object/public/assets/${fullPath})`;
              document.getElementById('lbl-bg').innerText = `✅ ${item.name}`;
            } else if (category === 'music') {
              musicPath = fullPath;
              document.getElementById('lbl-music').innerText = `✅ ${item.name}`;
            } else {
              const name = document.getElementById('new-actor-name').value;
              const initialPos = [216 + (actorsList.length * 30), 111];

              const newActor = {
                id: 'actor_' + Date.now(),
                name: name,
                type: pendingActorAssetType,
                asset: fullPath,
                pos: initialPos
              };
              actorsList.push(newActor);

              renderStageActors();
              renderTimeline();
              updateDropdownOptions();
              document.getElementById('new-actor-name').value = '';
            }
            closePicker();
          };
        }
        container.appendChild(card);
      }
    }

    function renderTimeline() {
      const tracksContainer = document.getElementById('timeline-tracks');
      tracksContainer.innerHTML = '';

      actorsList.forEach(actor => {
        const row = document.createElement('div');
        row.className = 'track-row';
        row.innerHTML = `<div class="track-label">👤 ${actor.name}</div><div class="track-content" id="track-actor-${actor.id}"></div>`;
        tracksContainer.appendChild(row);

        const content = row.querySelector('.track-content');
        const block = document.createElement('div');
        block.className = 'timeline-block actor-track';
        block.style.left = '0%';
        block.style.width = '100%';
        block.innerText = `${actor.type.toUpperCase()}: ${actor.name}`;
        block.onclick = () => openActorInspector(actor);
        content.appendChild(block);
      });

      const eventRow = document.createElement('div');
      eventRow.className = 'track-row';
      eventRow.innerHTML = `<div class="track-label">🎬 Eventi</div><div class="track-content" id="track-events"></div>`;
      tracksContainer.appendChild(eventRow);

      const eventContent = eventRow.querySelector('#track-events');
      timelineEvents.forEach(ev => {
        const block = document.createElement('div');
        block.className = `timeline-block ${ev.type}`;
        block.style.left = `${(ev.start / cutsceneDuration) * 100}%`;
        block.style.width = `${(ev.duration / cutsceneDuration) * 100}%`;
        block.innerText = ev.type === 'dialogue' ? `💬 ${ev.speaker}: ${ev.text}` : `🏃 ${ev.actor}`;
        
        const resizerRight = document.createElement('div');
        resizerRight.className = 'resizer right';
        block.appendChild(resizerRight);

        resizerRight.addEventListener('mousedown', (e) => {
          e.stopPropagation();
          let startX = e.clientX;
          let initialWidth = block.offsetWidth;
          let trackWidth = eventContent.offsetWidth;

          function onMouseMove(e) {
            let deltaX = e.clientX - startX;
            let newWidthPx = Math.max(20, initialWidth + deltaX);
            let newDuration = parseFloat(((newWidthPx / trackWidth) * cutsceneDuration).toFixed(1));
            ev.duration = Math.min(cutsceneDuration - ev.start, newDuration);
            renderTimeline();
          }

          function onMouseUp() {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
          }

          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });

        const resizerLeft = document.createElement('div');
        resizerLeft.className = 'resizer left';
        block.appendChild(resizerLeft);

        resizerLeft.addEventListener('mousedown', (e) => {
          e.stopPropagation();
          let startX = e.clientX;
          let initialLeft = block.offsetLeft;
          let trackWidth = eventContent.offsetWidth;

          function onMouseMove(e) {
            let deltaX = e.clientX - startX;
            let newLeftPx = Math.max(0, initialLeft + deltaX);
            let newStart = parseFloat(((newLeftPx / trackWidth) * cutsceneDuration).toFixed(1));
            let endSec = ev.start + ev.duration;

            if (newStart < endSec) {
              ev.start = newStart;
              ev.duration = parseFloat((endSec - newStart).toFixed(1));
              renderTimeline();
            }
          }

          function onMouseUp() {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
          }

          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });

        block.onclick = () => openEventInspector(ev);
        eventContent.appendChild(block);
      });
    }

    async function openActorInspector(actor) {
      document.getElementById('modal-title').innerText = `Gestisci Personaggio: ${actor.name}`;
      const container = document.getElementById('asset-container');
      const existingMove = timelineEvents.find(e => e.type === 'move' && e.actor === actor.name);
      
      const moveFrom = existingMove ? existingMove.from : [...actor.pos];
      const moveTo = existingMove ? existingMove.to : [actor.pos[0] + 50, actor.pos[1]];

      let basePath = actor.asset.substring(0, actor.asset.lastIndexOf('/')) || 'sprite/personaggioprincipale/fallback';

      container.innerHTML = `
        <div style="grid-column: 1 / -1; display:flex; flex-direction:column; gap:12px;">
          <div class="field"><label>Nome Personaggio:</label><input type="text" id="edit-actor-name" value="${actor.name}"></div>
          
          <div class="field">
            <label>Posa / Sprite:</label>
            <select id="edit-actor-pose">
              <option value="${basePath}/standing.png" ${actor.asset.endsWith('standing.png') ? 'selected' : ''}>Standing (Fronte)</option>
              <option value="${basePath}/back.png" ${actor.asset.endsWith('back.png') ? 'selected' : ''}>Back (Retro)</option>
              <option value="${basePath}/looking-left.png" ${actor.asset.endsWith('looking-left.png') ? 'selected' : ''}>Looking Left (Sinistra)</option>
              <option value="${basePath}/looking-right.png" ${actor.asset.endsWith('looking-right.png') ? 'selected' : ''}>Looking Right (Destra)</option>
            </select>
          </div>

          <hr style="border-color:var(--border);">
          <h4>Posizione Iniziale</h4>
          <div style="display:flex; gap:10px; align-items:center;">
            <button style="background:#8b5cf6; flex:1;" onclick="startActorClickSelect('${actor.name}', 'start')">🖱 Seleziona Posizione Iniziale con un click</button>
            <div class="field" style="width:70px; margin:0;"><label>X</label><input type="number" id="edit-actor-x" value="${actor.pos[0]}"></div>
            <div class="field" style="width:70px; margin:0;"><label>Y</label><input type="number" id="edit-actor-y" value="${actor.pos[1]}"></div>
          </div>

          <hr style="border-color:var(--border);">
          <h4>Movimento / Posizione Finale</h4>
          <div style="display:flex; gap:10px; align-items:center;">
            <button style="background:#3b82f6; flex:1;" onclick="startActorClickSelect('${actor.name}', 'end')">🖱 Seleziona Posizione Finale con un click</button>
            <div class="field" style="width:70px; margin:0;"><label>X</label><input type="number" id="edit-move-end-x" value="${moveTo[0]}"></div>
            <div class="field" style="width:70px; margin:0;"><label>Y</label><input type="number" id="edit-move-end-y" value="${moveTo[1]}"></div>
          </div>

          <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn-success" onclick="saveActorInspector('${actor.id}')">Salva</button>
            ${actor.id !== 'hero' ? `<button style="background:#dc3545;" onclick="deleteActor('${actor.id}')">🗑 Rimuovi dalla Timeline</button>` : ''}
          </div>
        </div>
      `;
      document.getElementById('picker-modal').style.display = 'block';
    }

    function startActorClickSelect(actorName, mode) {
      closePicker();
      clickMoveTargetActor = actorName;
      clickMoveStep = mode; 
      alert(`Clicca sullo stage per impostare la posizione ${mode === 'start' ? 'iniziale' : 'finale'} di ${actorName}`);
    }

    function saveActorInspector(actorId) {
      const actor = actorsList.find(a => a.id === actorId);
      if (actor) {
        actor.name = document.getElementById('edit-actor-name').value;
        actor.asset = document.getElementById('edit-actor-pose').value;
        actor.pos[0] = parseInt(document.getElementById('edit-actor-x').value || 0);
        actor.pos[1] = parseInt(document.getElementById('edit-actor-y').value || 0);

        let endX = parseInt(document.getElementById('edit-move-end-x').value || actor.pos[0]);
        let endY = parseInt(document.getElementById('edit-move-end-y').value || actor.pos[1]);

        let ev = timelineEvents.find(e => e.type === 'move' && e.actor === actor.name);
        if (!ev) {
          timelineEvents.push({
            id: Date.now(),
            type: 'move',
            actor: actor.name,
            from: [...actor.pos],
            to: [endX, endY],
            start: 0,
            duration: 3
          });
        } else {
          ev.from = [...actor.pos];
          ev.to = [endX, endY];
        }

        renderStageActors();
        renderTimeline();
        updateDropdownOptions();
      }
      closePicker();
    }

    function deleteActor(actorId) {
      const idx = actorsList.findIndex(a => a.id === actorId);
      if (idx !== -1) actorsList.splice(idx, 1);
      renderStageActors();
      renderTimeline();
      updateDropdownOptions();
      closePicker();
    }

    function openEventInspector(ev) {
      document.getElementById('modal-title').innerText = `Modifica Evento`;
      const container = document.getElementById('asset-container');
      container.innerHTML = `
        <div style="grid-column: 1 / -1; display:flex; flex-direction:column; gap:10px;">
          <div class="field"><label>Inizio (s):</label><input type="number" id="edit-ev-start" value="${ev.start}" step="0.5"></div>
          <div class="field"><label>Durata (s):</label><input type="number" id="edit-ev-duration" value="${ev.duration}" step="0.5"></div>
          <div style="display:flex; gap:10px;">
            <button class="btn-success" onclick="saveEventInspector(${ev.id})">Salva Evento</button>
            <button style="background:#dc3545;" onclick="deleteEvent(${ev.id})">Elimina</button>
          </div>
        </div>
      `;
      document.getElementById('picker-modal').style.display = 'block';
    }

    function saveEventInspector(id) {
      const ev = timelineEvents.find(x => x.id === id);
      if (ev) {
        ev.start = parseFloat(document.getElementById('edit-ev-start').value);
        ev.duration = parseFloat(document.getElementById('edit-ev-duration').value);
        renderTimeline();
      }
      closePicker();
    }

    function deleteEvent(id) {
      const idx = timelineEvents.findIndex(x => x.id === id);
      if (idx !== -1) timelineEvents.splice(idx, 1);
      renderTimeline();
      closePicker();
    }

    function addDialogueEvent() {
      const start = parseFloat(document.getElementById('event-start').value || 0);
      const duration = parseFloat(document.getElementById('event-duration').value || 2);
      const speaker = document.getElementById('dialogue-speaker').value;
      const text = document.getElementById('event-text').value;

      timelineEvents.push({ id: Date.now(), type: 'dialogue', speaker, text, start, duration });
      renderTimeline();
    }

    function handleStageGlobalClick(e) {
      if (isDialogueWaiting) {
        document.getElementById('dialogue-overlay').style.display = 'none';
        isDialogueWaiting = false;
        return;
      }
      if (clickMoveStep === 0) return;

      const rect = document.getElementById('stage').getBoundingClientRect();
      const scaledSize = (48 * globalSpriteScale) / 100;
      const x = Math.round(e.clientX - rect.left - (scaledSize / 2));
      const y = Math.round(e.clientY - rect.top - (scaledSize / 2));

      const actorObj = actorsList.find(a => a.name === clickMoveTargetActor);
      if (actorObj) {
        if (clickMoveStep === 'start') {
          actorObj.pos = [x, y];
          let ev = timelineEvents.find(ev => ev.type === 'move' && ev.actor === actorObj.name);
          if (ev) ev.from = [x, y];
        } else if (clickMoveStep === 'end') {
          let ev = timelineEvents.find(ev => ev.type === 'move' && ev.actor === actorObj.name);
          if (!ev) {
            timelineEvents.push({
              id: Date.now(),
              type: 'move',
              actor: actorObj.name,
              from: [...actorObj.pos],
              to: [x, y],
              start: 0,
              duration: 3
            });
          } else {
            ev.to = [x, y];
          }
        }
        renderStageActors();
        renderTimeline();
      }
      clickMoveStep = 0;
      clickMoveTargetActor = null;
    }

    function startPreview() {
      stopPreview();
      isPreviewRunning = true;
      let currentTime = 0;
      const triggered = new Set();

      if (musicPath) {
        bgAudio.src = `${SUPABASE_URL}/storage/v1/object/public/assets/${musicPath}`;
        bgAudio.play().catch(e => console.error(e));
      }

      previewTimer = setInterval(() => {
        if (!isPreviewRunning || isDialogueWaiting) return;
        
        timelineEvents.forEach(ev => {
          if (ev.type === 'move' && currentTime >= ev.start && currentTime <= (ev.start + ev.duration)) {
            const actorObj = actorsList.find(a => a.name === ev.actor);
            if (actorObj) {
              const dom = document.getElementById(`actor-dom-${actorObj.id}`);
              if (dom) {
                const progress = (currentTime - ev.start) / ev.duration;
                const currentX = ev.from[0] + (ev.to[0] - ev.from[0]) * progress;
                const currentY = ev.from[1] + (ev.to[1] - ev.from[1]) * progress;
                dom.style.left = currentX + 'px';
                dom.style.top = currentY + 'px';
              }
            }
          }

          if (!triggered.has(ev.id) && currentTime >= ev.start) {
            triggered.add(ev.id);
            if (ev.type === 'dialogue') {
              isDialogueWaiting = true;
              const speakerEl = document.getElementById('dialogue-speaker-name');
              const textEl = document.getElementById('dialogue-text-content');
              
              if (ev.speaker === 'Narratore') {
                speakerEl.style.display = 'none';
                textEl.className = 'text narrator-style';
              } else {
                speakerEl.style.display = 'block';
                speakerEl.innerText = ev.speaker;
                textEl.className = 'text';
              }
              
              textEl.innerText = ev.text;
              document.getElementById('dialogue-overlay').style.display = 'block';
            }
          }
        });

        currentTime += 0.05;
        document.getElementById('time-display').innerText = `${currentTime.toFixed(1)} / ${cutsceneDuration.toFixed(1)} s`;
        if (currentTime >= cutsceneDuration) stopPreview();
      }, 50);
    }

    function stopPreview() {
      isPreviewRunning = false;
      isDialogueWaiting = false;
      if (previewTimer) clearInterval(previewTimer);
      bgAudio.pause();
      document.getElementById('dialogue-overlay').style.display = 'none';
      renderStageActors();
    }

    function generateJSONData() {
      return { 
        duration: cutsceneDuration,
        spriteScale: globalSpriteScale,
        background: backgroundPath, 
        music: musicPath, 
        actors: actorsList, 
        events: timelineEvents 
      };
    }

    async function saveToSupabase() {
      const dayNumber = prompt("Inserisci il numero del giorno (es. 1 per giorno1.json):");
      if (!dayNumber) return;

      const fileName = `cutscenes/giorno${dayNumber.trim()}.json`;
      const jsonContent = JSON.stringify(generateJSONData(), null, 2);
      const blob = new Blob([jsonContent], { type: 'application/json' });

      try {
        const { error } = await _supabase.storage
          .from('assets')
          .upload(fileName, blob, { 
            upsert: true,
            cacheControl: '0'
          });

        if (error) throw error;
        alert(`Cutscene salvata con successo come ${fileName}!`);
      } catch(e) {
        alert("Errore nel salvataggio: " + e.message);
      }
    }

    function exportJSON() {
      const jsonString = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(generateJSONData(), null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", jsonString);
      downloadAnchor.setAttribute("download", "cutscene.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }
  </script>
</body>
