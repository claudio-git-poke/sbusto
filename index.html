<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <!-- [PARTE 1] Invariata -->

<body>

    <!-- [PARTE 2] Invariata -->
    <header>
        <h1>Tagliando e Carte con Supabase</h1>
    </header>

    <!-- [PARTE 3] Invariata -->
    <main>
        <section id="gioco">
            <!-- Interfaccia di gioco originale -->
        </section>
    </main>

    <!-- [PARTE 4] Logica dei suoni aggiornata a Supabase Storage -->
    <script>
        // URL base ufficiale del tuo storage Supabase per il bucket/cartella dei suoni
        const SUPABASE_STORAGE_URL = "https://tssgkiytaxmcrodrcrpu.supabase.co/storage/v1/object/public/soundfx";

        // Inizializzazione dei file MP3 presi direttamente da Supabase
        const suoni = {
            strappare: new Audio(`${SUPABASE_STORAGE_URL}/strappare.mp3`),
            swush: new Audio(`${SUPABASE_STORAGE_URL}/swush.mp3`)
        };

        // Funzione globale o di gestione per riprodurre i suoni quando necessario nel gioco
        function riproduciSuono(nomeSuono) {
            if (suoni[nomeSuono]) {
                suoni[nomeSuono].pause();
                suoni[nomeSuono].currentTime = 0;
                suoni[nomeSuono].play().catch(error => {
                    console.error("Errore di riproduzione audio:", error);
                });
            }
        }
    </script>

    <!-- [PARTE 5] Invariata -->
    <script>
        // Codice originale della parte 5
    </script>

    </footer>
</body>
