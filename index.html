<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameBoy Streak</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { 
      background: #1a1a1a; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-family: 'Press Start 2P', monospace;
      padding: 10px;
    }

    #gameboy-frame {
      width: 100%;
      max-width: 600px;
      height: 95vh;
      max-height: 500px;
      background: #d32f2f;
      border: 6px solid #8b0000;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 15px;
    }
    
    #frame-label {
      position: absolute;
      top: 8px;
      color: #fff;
      font-size: 7px;
      letter-spacing: 1px;
      text-align: center;
    }

    #screen-wrapper {
      width: 100%;
      max-width: 400px;
      height: 100%;
      max-height: 300px;
      aspect-ratio: 4 / 3;
      background: #000;
      border: 4px solid #333;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .screen { width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 12px; box-sizing: border-box; }
    .active { display: flex; }

    /* PARTE 0 LOGIN */
    #part0 { background: #222; color: #fff; font-size: 8px; }
    #part0 input { font-family: 'Press Start 2P', monospace; font-size: 7px; padding: 6px; margin: 6px 0 12px 0; width: 80%; border: 2px solid #fff; background: #000; color: #9bbc0f; }

    #part1 { background: #111; color: #fff; }
    #part2 { background: #000; }
    .turning-on { animation: turnOn 1.5s forwards; }
    @keyframes turnOn {
      0% { background: #000; opacity: 0; }
      50% { background: #8b956d; opacity: 0.5; }
      100% { background: #9bbc0f; opacity: 1; }
    }

    .gb-screen { background: #9bbc0f; color: #0f380f; }

    .card-container { position: relative; width: 160px; height: 230px; margin-top: 10px; }
    .card-wrapper { position: absolute; width: 100%; height: 100%; transition: transform 0.4s ease, opacity 0.4s ease; cursor: grab; }
    .card-swiped { transform: translateY(-350px) rotate(-10deg) !important; opacity: 0 !important; pointer-events: none; }
    
    .card { width: 100%; height: 100%; background: #e0f8d0; border: 3px solid #0f380f; border-radius: 6px; padding: 6px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
    .card img { width: 100%; height: 110px; object-fit: cover; border: 2px solid #0f380f; }
    .card-title { font-size: 8px; color: #0f380f; }
    .card-rarity { font-size: 6px; background: #306230; color: #9bbc0f; padding: 2px 4px; }
    .duplicate-tag { font-size: 6px; color: #8b0500; font-weight: bold; }

    #part-album { background: #fff; color: #000; font-family: Arial, sans-serif; text-align: left; justify-content: flex-start; padding: 10px; overflow-y: auto; }
    .excel-header { font-size: 10px; font-weight: bold; background: #f0f0f0; border: 1px solid #ccc; padding: 4px; margin-bottom: 6px; }
    .excel-table { width: 100%; border-collapse: collapse; font-size: 9px; }
    .excel-table th, .excel-table td { border: 1px solid #ccc; padding: 4px; text-align: left; }
    .excel-table th { background: #e6e6e6; }
    .excel-table tr:nth-child(even) { background: #f9f9f9; }

    button { font-family: 'Press Start 2P', monospace; padding: 10px 12px; font-size: 8px; cursor: pointer; background: #8b956d; color: #0f380f; border: 3px solid #0f380f; box-shadow: 2px 2px 0px #306230; margin-top: 8px; }
    button:active { transform: translate(1px, 1px); box-shadow: 0px 0px 0px #306230; }
    
    .btn-small { padding: 6px 8px; font-size: 7px; }
    .stat-box { font-size: 6px; line-height: 10px; text-align: left; }

    /* RENDERER CUTSCENE ENGINE */
    .actor-sprite { 
      position: absolute; 
      width: 48px; 
      height: 48px; 
      pointer-events: none; 
      z-index: 5; 
      image-rendering: pixelated; 
      object-fit: contain; 
    }
  </style>
</head>
<body>

  <div id="gameboy-frame">
    <div id="frame-label">[ GAMEBOY PLAYER ]</div>

    <div id="screen-wrapper">

      <!-- PARTE 0: LOGIN & PROFILO -->
      <div id="part0" class="screen active">
        <div style="margin-bottom: 8px; color: #9bbc0f;">CONFIGURAZIONE</div>
        <label>NOME UTENTE:</label>
        <input type="text" id="login-username" value="Giocatore">
        <label>URL AVATAR (PNG):</label>
        <input type="text" id="login-avatar" value="https://picsum.photos/40/40?random=88">
        <button onclick="saveProfileAndGoToPart1()">SALVA E VAI</button>
      </div>

      <!-- PARTE 1: START -->
      <div id="part1" class="screen">
        <button id="start-btn" onclick="startApp()">START</button>
      </div>

      <!-- PARTE 2: ACCENSIONE -->
      <div id="part2" class="screen"></div>

      <!-- PARTE 3: CUTSCENE ENGINE -->
      <div id="part3" class="screen gb-screen" onclick="handleCutsceneClick()" style="position: relative; overflow: hidden; padding: 0; cursor: pointer; width: 100%; height: 100%;">
        <div id="cutscene-bg" style="position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; z-index: 1;"></div>
        <div id="sprites-layer" style="position: absolute; width: 100%; height: 100%; z-index: 2; pointer-events: none;"></div>

        <div class="stat-box" style="position: absolute; top: 5px; left: 5px; z-index: 10; background: rgba(155, 188, 15, 0.85); padding: 4px; border-radius: 4px;">
          <div>STREAK: <span id="val-streak">1</span> GG | MESI: <span id="val-months">0</span></div>
          <div>BAMBOLE: <span id="val-dolls">0</span>/3 | POLVERE: <span id="val-dust">0</span></div>
        </div>

        <div id="dialogue-box" style="position: absolute; bottom: 8px; left: 4%; width: 92%; min-height: 50px; background: #e0f8d0; border: 3px solid #0f380f; padding: 6px; z-index: 10; text-align: left; display: none;">
          <div id="speaker-name" style="font-size: 7px; color: #306230; font-weight: bold; margin-bottom: 4px; text-transform: uppercase;"></div>
          <div id="dialogue-text" style="font-size: 7px; line-height: 10px; color: #0f380f;"></div>
          <div style="font-size: 5px; color: #306230; position: absolute; bottom: 2px; right: 4px;">[CLICK OVUNQUE PER AVANZARE]</div>
        </div>
        <audio id="bg-music" loop></audio>
      </div>

      <!-- PARTE 4: SBUSTATA -->
      <div id="part4" class="screen" style="background: #000; color: #fff;">
        <div style="font-size: 7px; margin-bottom: 4px;">SCORRI IN ALTO (SWIPE)</div>
        <div class="card-container" id="cards-stack"></div>
        <button id="btn-to-part5" onclick="goToPart5()" style="display:none; margin-top: 10px;">RIEPILOGO</button>
      </div>

      <!-- PARTE 5: RIEPILOGO & ALBUM -->
      <div id="part5" class="screen gb-screen">
        <h3 style="font-size: 9px; margin-bottom: 6px;">RIEPILOGO</h3>
        <div id="summary-content" style="font-size: 6px; line-height: 11px; max-width: 90%;"></div>
        <button onclick="openAlbum()" class="btn-small" style="background: #306230; color: #9bbc0f; margin-top: 12px;">VEDI ALBUM EXCEL</button>
        <button onclick="turnOff()">SPEGNI</button>
      </div>

      <!-- PARTE 6: FINE -->
      <div id="part6" class="screen" style="background: #000;">
        <button onclick="restart()" style="background: #fff; color: #000;">FINE</button>
      </div>

      <!-- PARTE ALBUM EXCEL -->
      <div id="part-album" class="screen">
        <div class="excel-header">DATABASE INVENTARIO UTENTE</div>
        <div style="font-size: 9px; margin-bottom: 6px;">
          <b>Polvere Totale:</b> <span id="excel-dust">0</span>
        </div>
        <table class="excel-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Rarità</th>
              <th>Qtà</th>
            </tr>
          </thead>
          <tbody id="excel-table-body"></tbody>
        </table>
        <button onclick="showScreen('part5')" class="btn-small" style="margin-top: 10px; background: #ccc; color: #000;">TORNA AL RIEPILOGO</button>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://tssgkiytaxmcrodrcrpu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_3JHORvzXFoBh7XVVuSqgTg__ezQdQMa';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let audioCtx = null;
    
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playRetroSound(type) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'start') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'swipe') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
          osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'off') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
          osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }
      } catch(e) {}
    }

    let userData = null;
    let drawnCards = [];
    let sessionSummary = [];
    let cardsSwipedCount = 0;
    
    let cutsceneData = null;
    let cutsceneTimer = null;
    let cutsceneTime = 0;
    let isDialogueActive = false;
    let triggeredEvents = new Set();

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    async function saveProfileAndGoToPart1() {
      const uName = document.getElementById('login-username').value.trim() || 'Giocatore';
      const uAvatar = document.getElementById('login-avatar').value.trim() || 'https://picsum.photos/40/40?random=88';

      try {
        await _supabase.from('user_state').upsert({ id: 1, username: uName, avatar_url: uAvatar }, { onConflict: 'id' });
      } catch(e) {}

      showScreen('part1');
    }

    function startApp() {
      playRetroSound('start');
      const p2 = document.getElementById('part2');
      showScreen('part2');
      p2.classList.add('turning-on');
      
      setTimeout(() => { 
        p2.classList.remove('turning-on');
        checkAndGoToPart3(); 
      }, 1500);
    }

    async function checkAndGoToPart3() {
      showScreen('part3');
      
      try {
        const { data } = await _supabase.from('user_state').select('*').eq('id', 1).single();
        userData = data || { streak_day: 1, months_completed: 0, dolls_count: 0, dust_count: 0, username: 'Giocatore', avatar_url: 'https://picsum.photos/40/40?random=88' };
      } catch(e) {
        userData = { streak_day: 1, months_completed: 0, dolls_count: 0, dust_count: 0, username: 'Giocatore', avatar_url: 'https://picsum.photos/40/40?random=88' };
      }

      const today = new Date().toISOString().split('T')[0];
      
      if (userData.last_claim_date) {
        const lastDate = new Date(userData.last_claim_date);
        const currDate = new Date(today);
        const diffDays = Math.floor((currDate - lastDate) / (1000 * 60 * 60 * 24));

        if (diffDays > 1) {
          if (userData.dolls_count > 0) {
            userData.dolls_count -= 1;
            sessionSummary.push("Giorno saltato! Usata 1 Pokebambola.");
          } else {
            userData.streak_day = 1;
            sessionSummary.push("Streak resettata al Giorno 1.");
          }
        }
      }

      if ([7, 14, 21, 28].includes(userData.streak_day)) {
        if (userData.dolls_count < 3) {
          userData.dolls_count += 1;
          sessionSummary.push(`Bonus Giorno ${userData.streak_day}: +1 Pokebambola!`);
        } else {
          userData.dust_count += 50;
          sessionSummary.push(`Bonus Giorno ${userData.streak_day}: +50 Polvere (Bambole Max).`);
        }
      }

      document.getElementById('val-streak').innerText = userData.streak_day;
      document.getElementById('val-months').innerText = userData.months_completed;
      document.getElementById('val-dolls').innerText = userData.dolls_count;
      document.getElementById('val-dust').innerText = userData.dust_count;

      // DOWNLOAD CON CACHE-BUSTING PER FORZARE L'AGGIORNAMENTO
      const fileName = `cutscenes/giorno${userData.streak_day}.json`;
      try {
        const { data: publicUrlData } = _supabase.storage.from('assets').getPublicUrl(fileName);
        const response = await fetch(`${publicUrlData.publicUrl}?t=${Date.now()}`);
        if (response.ok) {
          cutsceneData = await response.json();
        }
      } catch(e) {
        console.error(`Errore download cutscene ${fileName}:`, e);
        cutsceneData = null;
      }

      if (!cutsceneData) {
        cutsceneData = {
          background: '',
          music: '',
          actors: [{ id: 'hero', name: userData.username || 'Hero', asset: '', pos: [176, 126] }],
          events: [{ id: 1, type: 'dialogue', speaker: 'SISTEMA', text: `Giorno ${userData.streak_day}: Benvenuto ${userData.username || 'Giocatore'}!`, start: 0, duration: 3 }]
        };
      }

      startCutscenePlayback();
    }

    function startCutscenePlayback() {
      const bgEl = document.getElementById('cutscene-bg');
      const audioEl = document.getElementById('bg-music');
      const spritesLayer = document.getElementById('sprites-layer');

      spritesLayer.innerHTML = '';
      triggeredEvents.clear();
      cutsceneTime = 0;
      isDialogueActive = false;

      if (cutsceneData.background) {
        bgEl.style.backgroundImage = `url('${SUPABASE_URL}/storage/v1/object/public/assets/${cutsceneData.background}')`;
      } else {
        bgEl.style.backgroundImage = 'none';
      }

      if (cutsceneData.music) {
        audioEl.src = `${SUPABASE_URL}/storage/v1/object/public/assets/${cutsceneData.music}`;
        audioEl.play().catch(() => {});
      } else {
        audioEl.pause();
      }

      // CALCOLO SCALA PROPORZIONALE 1:1 CON L'EDITOR
      const stage = document.getElementById('screen-wrapper');
      const scaleX = stage.clientWidth / 400;
      const scaleY = stage.clientHeight / 300;

      (cutsceneData.actors || []).forEach(actor => {
        const img = document.createElement('img');
        img.className = 'actor-sprite';
        img.id = `actor-sprite-${actor.id}`;
        
        if (actor.asset) {
          img.src = `${SUPABASE_URL}/storage/v1/object/public/assets/${actor.asset}`;
        } else {
          img.src = userData.avatar_url;
        }

        img.style.left = `${actor.pos[0] * scaleX}px`;
        img.style.top = `${actor.pos[1] * scaleY}px`;
        img.style.width = `${48 * scaleX}px`;
        img.style.height = `${48 * scaleY}px`;
        spritesLayer.appendChild(img);
      });

      cutsceneTimer = setInterval(() => {
        if (isDialogueActive) return;

        const currentScaleX = stage.clientWidth / 400;
        const currentScaleY = stage.clientHeight / 300;

        (cutsceneData.events || []).forEach(ev => {
          if (ev.type === 'move' && cutsceneTime >= ev.start && cutsceneTime <= (ev.start + ev.duration)) {
            const actorObj = cutsceneData.actors.find(a => a.name === ev.actor);
            if (actorObj) {
              const dom = document.getElementById(`actor-sprite-${actorObj.id}`);
              if (dom) {
                const progress = (cutsceneTime - ev.start) / ev.duration;
                const currentX = ev.from[0] + (ev.to[0] - ev.from[0]) * progress;
                const currentY = ev.from[1] + (ev.to[1] - ev.from[1]) * progress;
                
                dom.style.left = `${currentX * currentScaleX}px`;
                dom.style.top = `${currentY * currentScaleY}px`;
              }
            }
          }

          if (!triggeredEvents.has(ev.id) && cutsceneTime >= ev.start) {
            triggeredEvents.add(ev.id);
            if (ev.type === 'dialogue') {
              isDialogueActive = true;
              document.getElementById('speaker-name').innerText = ev.speaker;
              document.getElementById('dialogue-text').innerText = ev.text.replace(/\[nome\]/g, userData.username || 'Giocatore');
              document.getElementById('dialogue-box').style.display = 'block';
            }
          }
        });

        cutsceneTime += 0.05;

        if (cutsceneTime >= 10.0) {
          clearInterval(cutsceneTimer);
          document.getElementById('bg-music').pause();
          goToPart4();
        }
      }, 50);
    }

    function handleCutsceneClick() {
      if (isDialogueActive) {
        document.getElementById('dialogue-box').style.display = 'none';
        isDialogueActive = false;
      }
    }

    async function goToPart4() {
      showScreen('part4');
      const container = document.getElementById('cards-stack');
      container.innerHTML = '';
      cardsSwipedCount = 0;
      document.getElementById('btn-to-part5').style.display = 'none';

      let allCards = [];
      let ownedIds = [];

      try {
        const { data: cData } = await _supabase.from('cards').select('*');
        const { data: iData } = await _supabase.from('user_inventory').select('card_id');
        if(cData) allCards = cData;
        if(iData) ownedIds = iData.map(i => i.card_id);
      } catch(e) {}

      if (allCards.length === 0) {
        allCards = [{ id: 1, name: 'Carta Prova', rarity: 'Comune', image_url: 'https://picsum.photos/200/280' }];
      }

      const cardsByRarity = {
        'Comune': allCards.filter(c => c.rarity === 'Comune'),
        'Rara': allCards.filter(c => c.rarity === 'Rara'),
        'Epica': allCards.filter(c => c.rarity === 'Epica'),
        'Leggendaria': allCards.filter(c => c.rarity === 'Leggendaria')
      };

      function getRandomCardByRarity() {
        const rand = Math.random() * 100;
        let targetRarity = 'Comune';

        if (rand < 5) targetRarity = 'Leggendaria';
        else if (rand < 15) targetRarity = 'Epica';
        else if (rand < 40) targetRarity = 'Rara';
        else targetRarity = 'Comune';

        let pool = cardsByRarity[targetRarity];
        if (!pool || pool.length === 0) pool = allCards;
        return pool[Math.floor(Math.random() * pool.length)];
      }

      drawnCards = [];
      for (let i = 0; i < 4; i++) {
        const randomCard = getRandomCardByRarity();
        const isDuplicate = ownedIds.includes(randomCard.id);
        drawnCards.push({ ...randomCard, isDuplicate });
      }

      drawnCards.forEach((card, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'card-wrapper';
        wrapper.style.zIndex = 4 - index;
        
        let dupHTML = card.isDuplicate ? `<div class="duplicate-tag">DOPPIONE (+10 Polvere)</div>` : '';

        wrapper.innerHTML = `
          <div class="card">
            <div class="card-title">${card.name}</div>
            <img src="${card.image_url}" alt="card">
            <div class="card-rarity">${card.rarity}</div>
            ${dupHTML}
          </div>
        `;

        let startY = 0;
        wrapper.addEventListener('touchstart', e => { startY = e.touches[0].clientY; });
        wrapper.addEventListener('touchend', e => {
          if (startY - e.changedTouches[0].clientY > 30) performSwipe(wrapper);
        });
        wrapper.addEventListener('mousedown', e => { startY = e.clientY; });
        wrapper.addEventListener('mouseup', e => {
          if (startY - e.clientY > 30) performSwipe(wrapper);
        });

        container.appendChild(wrapper);
      });
    }

    function performSwipe(wrapper) {
      if (wrapper.classList.contains('card-swiped')) return;
      playRetroSound('swipe');
      wrapper.classList.add('card-swiped');
      cardsSwipedCount++;

      if (cardsSwipedCount === 4) {
        document.getElementById('btn-to-part5').style.display = 'block';
      }
    }

    async function goToPart5() {
      for (const card of drawnCards) {
        if (card.isDuplicate) {
          userData.dust_count += 10;
          sessionSummary.push(`Doppione (${card.name}): +10 Polvere`);
        } else {
          try {
            await _supabase.from('user_inventory').insert({ card_id: card.id });
          } catch(e) {}
          sessionSummary.push(`Nuova: ${card.name} (${card.rarity})`);
        }
      }

      let nextDay = userData.streak_day + 1;
      let nextMonths = userData.months_completed;
      if (userData.streak_day >= 30) {
        nextDay = 1;
        nextMonths += 1;
        sessionSummary.push("Mese completato! Ripartirai dal Giorno 1.");
      }

      const today = new Date().toISOString().split('T')[0];

      try {
        await _supabase.from('user_state').update({
          streak_day: nextDay,
          months_completed: nextMonths,
          dolls_count: userData.dolls_count,
          dust_count: userData.dust_count,
          last_claim_date: today
        }).eq('id', 1);
      } catch(e) {}

      const summaryBox = document.getElementById('summary-content');
      summaryBox.innerHTML = sessionSummary.map(item => `<p style="margin-bottom: 4px;">- ${item}</p>`).join('');

      showScreen('part5');
    }

    function turnOff() {
      playRetroSound('off');
      showScreen('part2');
      setTimeout(() => { showScreen('part6'); }, 1200);
    }

    function restart() {
      sessionSummary = [];
      showScreen('part0');
    }

    async function openAlbum() {
      showScreen('part-album');
      
      let dustCount = userData ? userData.dust_count : 0;
      document.getElementById('excel-dust').innerText = dustCount;

      let cards = [];
      let inventory = [];

      try {
        const { data: cData } = await _supabase.from('cards').select('*');
        const { data: iData } = await _supabase.from('user_inventory').select('card_id');
        if(cData) cards = cData;
        if(iData) inventory = iData;
      } catch(e) {}

      const counts = {};
      inventory.forEach(i => { counts[i.card_id] = (counts[i.card_id] || 0) + 1; });

      const tbody = document.getElementById('excel-table-body');
      tbody.innerHTML = '';

      cards.forEach(card => {
        const qty = counts[card.id] || 0;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${card.id}</td>
          <td>${card.name}</td>
          <td>${card.rarity}</td>
          <td style="font-weight:${qty > 0 ? 'bold' : 'normal'}">${qty}</td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
